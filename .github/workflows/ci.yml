name: CI

on:
  push:
  pull_request:

# A second push while the first job is still running makes the first result
# stale before it lands, and both jobs fight over the same npm cache.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The two jobs below are `npm test` split by what each step actually needs from
# the runner, and nothing else. Together they run the same six steps in the
# same order: typecheck, test:renderer-style, test:package-hooks,
# test:local-install, smoke. A CI that ran a smaller set than the command
# contributors are told to run is how a required build script stayed untracked
# at HEAD without anything going red — and then how test:renderer-style, added
# to `npm test` but never to this file, left the renderer ratchets enforced only
# on the machine of whoever remembered to run them.

jobs:
  check:
    name: typecheck + smoke
    runs-on: ubuntu-latest
    # The smoke suite waits on batches with 30s deadlines. If Electron ever
    # fails to exit, this stops it burning an hour of runner time.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # postinstall rebuilds node-pty and better-sqlite3 against Electron's
      # ABI, from source. That is half the value of running CI at all: a
      # typecheck-only job would pass while the addon a fresh clone needs
      # cannot compile.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Plain Node over src/shared, which is pure by construction: no Electron,
      # no display, no database. It runs before the slower gates because it is
      # the one step that answers in under a second, and a contract broken here
      # is not worth waiting thirty seconds to hear about.
      - name: Shared contract tests
        run: npm run test:shared

      # Plain Node over the renderer sources: no Electron, no display, no
      # install beyond what is already here. It sits on this job because it is
      # platform-independent and because the ratchets it guards — inline styles,
      # literal font sizes and durations, shadowed modifiers, form controls with
      # no accessible name — are exactly the kind of regression a reviewer reads
      # past.
      - name: Renderer style gate
        run: npm run test:renderer-style

      # What `noUnusedLocals` cannot see: a package two suites in `npm test`
      # require but nothing declares. `@electron/asar` was exactly that — it
      # resolved only as a transitive dependency of electron-builder, so
      # test:package-hooks and test:local-install would have broken on the
      # release that stopped hoisting it, on a fresh clone, for a reason no
      # contributor could have read off the diff. The gate covers the
      # categories that are clean today; over-exports are excluded as a
      # backlog rather than a regression, and `npm run dead-code:all` lists
      # them.
      - name: Dead code and undeclared dependencies
        run: npm run test:dead-code

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb

      # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor, and
      # Chromium's sandbox needs them. Without this Electron aborts before
      # app.whenReady() with a SUID sandbox error, so the smoke suite prints
      # nothing at all rather than a failure anyone can read. Tolerated when
      # the key does not exist, which is the case on 22.04.
      - name: Allow Chromium's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # Electron needs a display server to reach app.whenReady() even on the
      # smoke path, which never opens a window. The suite runs the mock runner:
      # no network, no API key, no spend.
      - name: Smoke
        run: xvfb-run --auto-servernum npm run smoke

  packaging:
    name: macOS packaging suites
    # The other two thirds of `npm test`. These are fixture-only: they build no
    # bundle, sign nothing, and never read or write /Applications. They still
    # belong on a macOS runner because what they assert is macOS packaging
    # behaviour — Electron fuses, the sealed-signature and asar-integrity
    # checks, and the installer's own quit/stage/promote sequence — and the
    # scripts under test guard several of those assertions on process.platform.
    # Skipping them on Linux would report green for checks that never ran.
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Package hooks
        run: npm run test:package-hooks

      - name: Local install fixtures
        run: npm run test:local-install

# Still no macOS *release* job. Signing and notarisation need an Apple Developer
# identity and an app-specific password; making CI depend on secrets that only
# exist on a maintainer's machine turns every fork's first pull request into a
# red build for a reason the contributor cannot fix. The packaging job above
# needs neither — it asserts the hooks against fixtures. Releases are cut with
# `npm run dist:mac` on a machine that has the identity.
