$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Feature
status: stable
description: 'An icon, a short heading and a sentence: one of a row of three.'
props:
  type: object
  properties:
    icon:
      type: [string, 'null']
      title: Icon
      enum: [mountain, compass, wave, leaf, tent, star, null]
      default: star
slots:
  heading:
    title: Heading
  text:
    title: Text
