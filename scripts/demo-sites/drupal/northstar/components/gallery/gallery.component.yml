$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Gallery
status: stable
description: 'A product’s pictures, the first one large and the rest beside it.'
props:
  type: object
  properties:
    count:
      type: integer
      title: Number of pictures
      examples: [3]
    label:
      type: string
      title: Accessible name
      examples: ['Pictures of the Lakeside Enamel Mug']
slots:
  items:
    title: Pictures
    description: One figure per picture; the first is drawn large.
