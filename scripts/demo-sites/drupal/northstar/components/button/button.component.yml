$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Button
status: stable
description: 'A link or button in one of four looks.'
props:
  type: object
  required: [label]
  properties:
    label:
      type: string
      title: Label
      examples: ['Shop the collection']
    url:
      type: [string, 'null']
      title: Address
      description: Draws a link when set, a button when not.
      examples: ['/shop']
    variant:
      type: [string, 'null']
      title: Look
      enum: [primary, secondary, light, link, null]
      default: primary
    arrow:
      type: [boolean, 'null']
      title: Arrow after the label
      default: false
