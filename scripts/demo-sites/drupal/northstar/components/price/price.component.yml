$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Price
status: stable
description: 'A price in dollars, struck-through earlier price when reduced, and a note on shipping.'
props:
  type: object
  required: [amount]
  properties:
    amount:
      type: number
      title: Amount
      examples: [24]
    was:
      type: [number, 'null']
      title: Earlier price
      examples: [34]
    note:
      type: [string, 'null']
      title: Note
      examples: ['Ships free']
    ships_free:
      type: [boolean, 'null']
      title: Ships free
      default: false
    size:
      type: [string, 'null']
      title: Size
      enum: [sm, lg, null]
      default: sm
